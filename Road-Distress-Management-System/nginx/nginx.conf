server {
    listen 80;
    server_name _;

    client_max_body_size 550M;  # matches backend's 500MB video upload limit + headroom

    root /usr/share/nginx/html;
    index index.html;

    # Flutter web app (static build output). try_files falls back to
    # index.html for any path so the app's client-side router (go_router)
    # handles deep links like /video-review/4 on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket (live camera feed): needs the Upgrade/Connection headers
    # explicitly, unlike the plain HTTP proxying below.
    location /api/v1/live/ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # REST API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;      # AI pipeline endpoints can run long
        proxy_send_timeout 300s;
    }

    # Uploaded/processed videos, detection crops, report downloads
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
